name: AquaGuard CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Simulation boundary check
        run: |
          ! grep -R "DATABASE_URL\|KUBERNETES_SERVICE_HOST\|PENTair" client/src/pages/PlatformOps.tsx
